name: Platform integration

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-integration
  cancel-in-progress: false

jobs:
  platform-integration:
    name: Platform integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install platform dependencies
        run: python -m pip install -e ".[dev,platform]"

      - name: Run platform integration suite
        run: >-
          python -m pytest -q -m platform_integration
          tests/integration/platform/test_metaflow_runtime.py
          tests/integration/platform/test_mlflow_tracking.py
