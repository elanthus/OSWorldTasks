name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy pixelgym

  release-integration:
    name: Release integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run loopback server contract tests
        run: >-
          python -m pytest -q -m local_http_integration
          tests/integration/test_vendor_form_server_contract.py

      - name: Run wheel packaging tests
        run: >-
          python -m pytest -q
          tests/integration/test_wheel_packaging.py

  unit-suite:
    name: Unit suite with coverage
    runs-on: ubuntu-latest
    # Current hosted coverage runs take about fourteen minutes; retain enough runner variance
    # for assertions, the coverage summary, and artifact upload to complete.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Frozen-evidence tests verify recorded revisions with git show; a shallow clone cannot serve them.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      # Keep this explicit check for an early, named evidence failure even though the unit suite
      # also exercises the verifier's non-mutation contract.
      - name: Verify frozen grounding report
        run: python scripts/verify_grounding_report.py

      - name: Run fast suite with coverage
        run: >-
          python -m pytest -q -n 4 --dist worksteal
          --hypothesis-profile=ci
          --cov=pixelgym
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
          tests/unit

      - name: Publish coverage summary
        if: ${{ always() }}
        run: |
          if [[ -f .coverage ]]; then
            {
              echo "## Fast-suite coverage"
              python -m coverage report --format=markdown --fail-under=0
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-suite-coverage
          path: coverage.xml
          if-no-files-found: warn

  fast-suite:
    name: Fast suite
    if: ${{ always() }}
    needs: [unit-suite, release-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require offline unit and release-integration suites
        env:
          UNIT_SUITE_RESULT: ${{ needs.unit-suite.result }}
          RELEASE_INTEGRATION_RESULT: ${{ needs.release-integration.result }}
        run: |
          test "$UNIT_SUITE_RESULT" = success
          test "$RELEASE_INTEGRATION_RESULT" = success
