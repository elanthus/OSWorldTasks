<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vendor Management — Onboarding</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <!-- Sticky header: 6 candidate elements -->
    <header id="app-header">
      <span class="header-logo">VendorHub</span>
      <nav class="header-nav">
        <a href="#" class="nav-link active" id="nav-vendors">Vendors</a>
        <a href="#" class="nav-link" id="nav-contracts">Contracts</a>
        <a href="#" class="nav-link" id="nav-reports">Reports</a>
        <a href="#" class="nav-link" id="nav-settings">Settings</a>
        <a href="#" class="nav-link" id="nav-help">Help</a>
      </nav>
    </header>

    <!-- Sidebar drawer: 8 candidate elements -->
    <aside id="sidebar">
      <a href="#" class="sidebar-link" id="sb-dashboard">Dashboard</a>
      <a href="#" class="sidebar-link active" id="sb-new-vendor">New Vendor</a>
      <a href="#" class="sidebar-link" id="sb-vendor-list">Vendor List</a>
      <a href="#" class="sidebar-link" id="sb-pending">Pending Review</a>
      <a href="#" class="sidebar-link" id="sb-import">Import Data</a>
      <a href="#" class="sidebar-link" id="sb-export">Export Data</a>
      <a href="#" class="sidebar-link" id="sb-audit">Audit Log</a>
      <a href="#" class="sidebar-link" id="sb-support">Support</a>
    </aside>

    <!-- Main content area -->
    <main id="main-content">
      <h1>New Vendor Onboarding</h1>
      <form id="vendor-form" autocomplete="off">
        <input type="hidden" id="task_id" name="task_id" />

        <!-- Section 1: Company Information -->
        <fieldset class="form-section">
          <legend>Company Information</legend>
          <div class="field-row">
            <label for="company_name">Company name</label>
            <input type="text" id="company_name" name="company_name" />
          </div>
          <div class="field-row">
            <label for="company_legal_name">Company legal name</label>
            <input type="text" id="company_legal_name" name="company_legal_name" />
          </div>
          <div class="field-row">
            <label for="company_trading_name">Company trading name</label>
            <input type="text" id="company_trading_name" name="company_trading_name" />
          </div>
          <div class="field-row">
            <label for="registration_id">Registration ID</label>
            <input type="text" id="registration_id" name="registration_id" />
          </div>
          <div class="field-row">
            <label for="tax_id">Tax ID</label>
            <input type="text" id="tax_id" name="tax_id" />
          </div>
          <div class="field-row">
            <label for="vat_number">VAT number</label>
            <input type="text" id="vat_number" name="vat_number" />
          </div>
        </fieldset>

        <!-- Section 2: Contact Information -->
        <fieldset class="form-section">
          <legend>Contact Information</legend>
          <div class="field-row">
            <label for="contact_email">Contact email</label>
            <input type="text" id="contact_email" name="contact_email" />
          </div>
          <div class="field-row">
            <label for="billing_email">Billing email</label>
            <input type="text" id="billing_email" name="billing_email" />
          </div>
          <div class="field-row">
            <label for="support_email">Support email</label>
            <input type="text" id="support_email" name="support_email" />
          </div>
          <div class="field-row">
            <label for="contact_phone">Contact phone</label>
            <input type="text" id="contact_phone" name="contact_phone" />
          </div>
          <div class="field-row">
            <label for="office_phone">Office phone</label>
            <input type="text" id="office_phone" name="office_phone" />
          </div>
          <div class="field-row">
            <label for="mobile_phone">Mobile phone</label>
            <input type="text" id="mobile_phone" name="mobile_phone" />
          </div>
        </fieldset>

        <!-- Section 3: Location -->
        <fieldset class="form-section">
          <legend>Location</legend>
          <div class="field-row">
            <label for="country">Country</label>
            <select id="country" name="country">
              <option value="" selected disabled>Select a country</option>
            </select>
          </div>
          <div class="field-row">
            <label for="region">Region</label>
            <select id="region" name="region">
              <option value="" selected disabled>Select a region</option>
            </select>
          </div>
          <div class="field-row">
            <label for="city">City</label>
            <input type="text" id="city" name="city" />
          </div>
          <div class="field-row">
            <label for="postal_code">Postal code</label>
            <input type="text" id="postal_code" name="postal_code" />
          </div>
        </fieldset>

        <!-- Section 4: Payment & Options -->
        <fieldset class="form-section">
          <legend>Payment &amp; Options</legend>
          <div class="field-row">
            <label>Payment terms</label>
            <div class="radio-group" id="payment_terms"></div>
          </div>
          <div class="field-row">
            <label for="currency">Currency</label>
            <select id="currency" name="currency">
              <option value="" selected disabled>Select currency</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
            </select>
          </div>
          <div class="field-row checkbox-row">
            <label>
              <input type="checkbox" id="expedited_onboarding" name="expedited_onboarding" />
              Expedited onboarding
            </label>
          </div>
          <div class="field-row checkbox-row">
            <label>
              <input type="checkbox" id="preferred_vendor" name="preferred_vendor" />
              Preferred vendor
            </label>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="button" id="save-draft-button">Save Draft</button>
          <button type="submit" id="submit-button">Submit</button>
          <button type="button" id="cancel-button">Cancel</button>
        </div>
        <div id="submit-status"></div>
      </form>
    </main>
    <div id="ready-sentinel" data-ready="false" style="display:none"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
