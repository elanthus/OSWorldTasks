<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VendorHub — Guided Review</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header><span class="logo">VendorHub</span><span>Guided review workspace</span><span id="task-ref"></span></header>
    <aside>
      <div class="nav active">Review queue</div><div class="nav">Vendors</div>
      <div class="nav">Policies</div><div class="nav">Audit</div>
      <div class="progress-title">Workflow</div>
      <div id="progress"></div>
    </aside>
    <main>
      <div id="recovery-banner" hidden></div>
      <section class="workspace">
        <div class="eyebrow" id="family"></div>
        <h1 id="heading"></h1>
        <p class="instruction" id="instruction"></p>
        <div class="facts" id="facts"></div>
        <div class="options" id="options"></div>
      </section>
      <section class="activity">
        <h2>Activity</h2>
        <p id="activity-text">No action has been recorded for this step.</p>
      </section>
    </main>
    <div id="ready-sentinel" data-ready="false"></div>
    <script id="episode-data" type="application/json">__V4B_EPISODE_JSON__</script>
    <script src="/static/app.js"></script>
  </body>
</html>
