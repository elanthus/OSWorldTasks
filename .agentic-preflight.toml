[diff]
max_bytes = 1600000
exclude = [
    "*.lock",
    "*-lock.json",
    "vendor/**",
    "**/*.min.js",
    "**/*.min.css",
    "**/__snapshots__/**",
    "**/*.pb.go",
    "**/*_pb2.py",
    "artifacts/day-1/**",
    "artifacts/day-2/**",
    "artifacts/day-3/**",
    "artifacts/grounding/**",
    "artifacts/grounding-v4-pilot/**",
    "artifacts/grounding-v5-*/**",
    "artifacts/grounding-*.json",
    "artifacts/grounding-*.jsonl",
    "artifacts/grounding-*.md",
    "artifacts/validation-report.json",
    "artifacts/validation-report.md",
    "tests/integration/fixtures/*.json",
    "tests/unit/fixtures/*.json",
]

[commands]
test = ".venv/bin/pytest -q -n 4 --dist worksteal tests/unit"
# Match the Ruff and mypy checks in .github/workflows/ci.yml.
lint = """
.venv/bin/ruff check . && \
.venv/bin/ruff format --check pixelgym flows scripts tests && \
.venv/bin/mypy pixelgym
"""
