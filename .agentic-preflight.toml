[diff]
max_bytes = 1200000
exclude = [
    "*.lock",
    "*-lock.json",
    "vendor/**",
    "**/*.min.js",
    "**/*.min.css",
    "**/__snapshots__/**",
    "**/*.pb.go",
    "**/*_pb2.py",
    "artifacts/day-1/**",
    "artifacts/day-2/**",
    "artifacts/day-3/**",
    "artifacts/grounding/**",
    "artifacts/grounding-*.json",
    "artifacts/grounding-*.jsonl",
    "artifacts/grounding-*.md",
    "artifacts/resume-bullets.md",
    "artifacts/validation-report.json",
    "artifacts/validation-report.md",
    "tests/integration/fixtures/*.json",
    "tests/unit/fixtures/*.json",
]

[commands]
test = ".venv/bin/pytest -q -n 4 --dist worksteal tests/unit"
lint = ".venv/bin/ruff check ."
