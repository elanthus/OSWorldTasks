[project]
name = "pixelgym"
version = "0.1.0"
description = "PixelGym-OSWorld: a pixel-only GUI reinforcement-learning environment and grounding benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium~=0.28.1",  # matches the osworld extra's pin (xlang-ai/OSWorld-V2@v2026.06.24)
    "numpy>=1.26",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Heavy, network-fetching stack. Only needed for Day 2 OSWorld integration
# tests; the core package and fast unit tests never require it.
osworld = [
    "osworld @ git+https://github.com/xlang-ai/OSWorld-V2.git@v2026.06.24",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "build>=1.0",
    "httpx2",  # fastapi.testclient.TestClient requires this on current starlette
    "setuptools>=68",  # the wheel-packaging test builds with --no-build-isolation
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pixelgym*"]

[tool.setuptools.package-data]
"pixelgym.tasks.vendor_form.app" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
