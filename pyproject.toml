[project]
name = "pixelgym"
version = "0.1.0"
description = "PixelGym-OSWorld: a pixel-only GUI reinforcement-learning environment and grounding benchmark"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",  # explicit: serving cancellation scopes are a direct platform dependency
    "gymnasium~=0.28.1",  # matches the osworld extra's pin (xlang-ai/OSWorld-V2@v2026.06.24)
    "numpy>=1.26",
    "pillow>=10.0",
    "fastapi>=0.110",
    "jsonschema[format-nongpl]==4.25.1",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Heavy, network-fetching stack for OSWorld integration tests; the core package
# and fast unit tests never require it.
osworld = [
    "osworld @ git+https://github.com/xlang-ai/OSWorld-V2.git@v2026.06.24",
    "chardet>=3,<6",  # OSWorld requests~=2.31 warns on the current chardet 7.x release
]
platform = [
    "mlflow==3.14.0",
    "metaflow==2.19.35",
    "boto3==1.40.1",
    "psycopg2-binary==2.9.10",
    "greenlet==3.5.4",  # SQLAlchemy requires this on x86_64 but not on arm64 lock hosts
    "httpx2==2.9.1",  # deployment smoke uses Starlette's TestClient at runtime
]
dev = [
    "coverage==7.16.0",
    "hypothesis==6.167.1",
    "pytest>=8.0",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3.8",
    "ruff>=0.4",
    "mypy>=1.17,<2",
    "types-jsonschema>=4.25",
    "build>=1.0",
    "pip-tools==7.5.3",  # regenerates the checked-in platform runtime lock
    "metaflow==2.19.35",  # flow graph and direct orchestration tests are part of the fast suite
    "httpx2",  # fastapi.testclient.TestClient requires this on current starlette
    "httpx>=0.27,<1",  # platform web tests directly import httpx.AsyncClient/ASGITransport
    "playwright>=1.52",  # deterministic grounding-dataset browser capture tooling
    "setuptools>=77",  # supports SPDX license metadata and no-isolation wheel tests
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pixelgym*"]

[tool.setuptools.package-data]
"pixelgym.tasks.vendor_form.app" = ["static/*", "static/fonts/*"]
"pixelgym.platform.web" = ["static/*"]
"pixelgym.platform.schemas" = ["*.json"]
"pixelgym.grounding.v5.schemas" = ["*.json"]
"pixelgym.grounding.v5.v5_app" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `tests.support` (the privileged golden-trajectory solver, shared with
# scripts/golden_trajectory.py) is importable from the repository root.
pythonpath = ["."]
# Loads the deterministic "ci" profile (registered in tests/conftest.py) for
# every invocation, not only the CI workflow's explicit flag, so a local
# `pytest tests/unit` run and the CI run generate identical examples.
addopts = "--hypothesis-profile=ci"
markers = [
    "local_http_integration: binds a real loopback socket without external network or services",
    "platform_integration: requires the optional MLflow/Metaflow platform dependencies or local services",
    "platform_compose_integration: provisions an isolated Docker Compose platform stack",
    "browser_integration: requires an installed Playwright Chromium browser and explicit opt-in",
    "osworld_integration: requires the pinned local OSWorld Docker runtime and guest image",
    "v5_sandbox_integration: requires Darwin sandbox-exec outside a parent process sandbox",
]

[tool.coverage.run]
# Measure the complete package, including optional OSWorld, browser, grounding,
# and platform paths. Keeping difficult modules in scope prevents the fast-suite
# baseline from being inflated by exclusions. `source = ["pixelgym"]` matches
# the packaging scope in [tool.setuptools.packages.find] and the mypy scope in
# [tool.mypy] `files`: `flows/` and `scripts/` are not part of the
# installable package and are out of scope for the same reason they are out of
# scope for those tools, not because they are hard to cover. The 12 pre-existing
# `# pragma: no cover` lines inside pixelgym (optional-import fallbacks and
# exhaustiveness guards unreachable without the optional extras) remain in
# force and are not re-justified per line here.
branch = true
source = ["pixelgym"]

[tool.coverage.report]
# The branch-aware fast suite measured 80.337% before issue #114's property
# tests were added, and 80.343% after (artifacts/ci-coverage-baseline-issue-114.md)
# — the new tests add negligible headroom (2217 -> 2216 missed statements out
# of 13686). Fail at the rounded pre-existing baseline so small regressions are
# caught without relying on margin the new tests themselves created.
fail_under = 80
precision = 2
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["pixelgym"]
strict = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Optional integrations are intentionally isolated from the core install and
# do not publish complete typing information.
module = [
    "boto3",
    "botocore.*",
    "desktop_env.*",
    "mlflow.*",
]
ignore_missing_imports = true
